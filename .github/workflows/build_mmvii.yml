name: Build MMVII Linux/Windows

on:
  push:
    branches:
      - 'main'
      # Branches allowed to publish a Docker image, tagged after the branch.
      # '*' does not match '/', so a branch reaching here has no '/' in its name.
      - 'docker-*'

jobs:
  build_linux:
    if: true
    runs-on: ubuntu-latest

    # The Docker image is published on GHCR, which needs no secret: the built-in
    # GITHUB_TOKEN is enough. But that token is read-only by default on many
    # repositories, and this block *replaces* the defaults for the job, so it must
    # also grant what the release steps below already rely on (contents: write).
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt and clang
      run: |
        sudo apt update
        sudo apt install qtbase5-dev clang-18 libomp-18-dev

    - name: Install libproj and libgdal
      run: sudo apt install libproj-dev proj-data libgdal-dev

    - name: Install pdflatex
      run: sudo apt install texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science

    - name: Build MMVII documentation
      run: make -C Doc a4

    - name: Remove previous MMVII documentation release
      env:
         GH_TOKEN: ${{ github.token }}
      continue-on-error: true
      run: gh release delete MMVII_Documentation -y --cleanup-tag

    - name: Upload MMVII documentaion
      uses: softprops/action-gh-release@v2
      with:
          name: 'MMVII Documentation - Latest'
          tag_name: MMVII_Documentation
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: Doc/Doc2007_a4.pdf

    - name: Configure CMake for MMVII
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      env:
        CXX: clang++-18
        CC: clang-18

    - name: Build MMVII
      run: cmake --build build -j 4 --target full_P2007 -- -k

    - name: Run MMVII Tests
      working-directory: ./bin
      run: ./MMVII Bench 1

    - name: Remove previous MMVII ApiPy release
      env:
         GH_TOKEN: ${{ github.token }}
      continue-on-error: true
      run: gh release delete MMVII_APIPY -y --cleanup-tag

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: linux-build-artifacts
        path: |
          bin/libP2007.a
          bin/MMVII

    # ------------------------------------------------------------------
    # Docker image containing the MMVII just built and tested above
    # ------------------------------------------------------------------

    - name: Name of the MMVII Docker image
      # ghcr.io/<owner>/<name>, and Docker refuses anything but lowercase in the name
      # while github.repository may hold uppercase (MMVII, cm-MMVII): hence the tr.
      # Deriving the name from the repository also means a fork publishes in its own
      # namespace and can never overwrite another image.
      #
      # The image is named mmvii, suffixed by the branch for a docker-xxxx branch, and
      # prefixed by whatever the repository name carries besides MMVII when it is not
      # the MMVII repository itself:
      #     micmac-v2/MMVII     main        -> mmvii
      #     micmac-v2/MMVII     docker-cm   -> mmvii-cm
      #     micmac-v2/cm-MMVII  docker-cm   -> cm-mmvii-cm
      # Every part is reduced to lowercase alphanumerics separated by '-', which is
      # always a valid name, branch names being far more permissive.
      run: |
        NAME=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
        OWNER=${NAME%%/*}
        REPO=${NAME#*/}
        PREFIX=$(printf '%s' "$REPO" | sed -e 's/mmvii//g' -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//')
        REF='${{ github.ref_name }}'
        if [ "$REF" = main ]; then
          SUFFIX=""
        else
          SUFFIX=$(printf '%s' "${REF#docker-}" | tr '[:upper:]' '[:lower:]' \
                     | sed -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//')
        fi
        IMAGE=mmvii
        if [ -n "$PREFIX" ]; then IMAGE="$PREFIX-$IMAGE" ; fi
        if [ -n "$SUFFIX" ]; then IMAGE="$IMAGE-$SUFFIX" ; fi
        echo "DOCKER_IMAGE=ghcr.io/$OWNER/$IMAGE" >> "$GITHUB_ENV"

    - name: Stage the files of the Docker image
      run: |
        rm -rf docker-context
        mkdir -p docker-context/MMVII/bin
        cp bin/MMVII docker-context/MMVII/bin/
        # Debug symbols are useless in the image and weigh a lot: only the copy
        # given to Docker is stripped, the uploaded artifact keeps them.
        strip docker-context/MMVII/bin/MMVII
        # MMVII locates its data relatively to its own executable: keep bin/ and
        # these directories siblings (cf .github/docker/Dockerfile).
        cp -a MMVII-RessourceDir MMVII-LocalParameters MMVII-TestDir bash-completion docker-context/MMVII/
        rm -rf docker-context/MMVII/MMVII-TestDir/Tmp
        cp .github/docker/Dockerfile docker-context/
        # Runtime packages, derived from the very binary being packaged instead of
        # being hard-coded: the image then follows the libraries MMVII was actually
        # linked against, whatever the Ubuntu release and whichever compiler was
        # used. ldd gives the resolved paths, realpath canonicalises them (ldd
        # prints /lib/..., dpkg indexes /usr/lib/...) and dpkg -S names the owners.
        # Left strict on purpose: a library owned by no package fails the job here,
        # rather than yielding an image whose MMVII cannot start.
        ldd bin/MMVII \
            | awk '{ if ($3 ~ /^\//) print $3 ; else if ($1 ~ /^\//) print $1 }' \
            | xargs -r realpath -e \
            | sort -u \
            | xargs -r dpkg -S \
            | cut -d: -f1 \
            | sort -u > docker-context/runtime-packages.txt
        echo "Runtime packages of the image:" ; cat docker-context/runtime-packages.txt

    - name: Build the MMVII Docker image
      # The source label is overridden here so that the package is linked to the
      # repository that publishes it, whichever it is; the Dockerfile keeps the
      # official repository as the default for a manual build.
      run: |
        # The binary is dynamically linked: the base image must be the release of
        # the runner that built it, whatever ubuntu-latest points to that day.
        . /etc/os-release
        docker build \
            --build-arg UBUNTU_VERSION="$VERSION_ID" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$DOCKER_IMAGE:latest" \
            docker-context

    - name: Run MMVII Tests in the Docker image
      run: docker run --rm "$DOCKER_IMAGE:latest" MMVII Bench 1

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # A package pushed by a workflow is private by default: making it public is a
    # one-off manual step in the package settings. It is linked to its repository
    # by the source label set at build time above.
    - name: Push the MMVII Docker image to GHCR
      # Only 'latest', so that a new build replaces the previous image
      run: docker push "$DOCKER_IMAGE:latest"


  build_win:
    if: true
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Generate token to download libelise.a
      id: app-token
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ secrets.LIBELISE_APP_ID }}
        private_key: ${{ secrets.LIBELISE_APP_PRIVATE_KEY }}

    - name: Download libelise.a
      run: |
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/micmac-V2/libelise-win-dev.git

    - name: Install Miniconda 
      uses: conda-incubator/setup-miniconda@v3
      with:
         auto-update-conda: true
         conda-remove-defaults: true
          
    - name: Install GDAL,PROJ with miniconda
      run: conda install -c conda-forge -q -y proj gdal
      if: steps.cache-conda-gdal.outputs.cache-hit != 'true'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with: 
        cache: false
        version: 5.15

    - name: Configure CMake for MMVII
      run: cmake -S . -B build -DCMAKE_PREFIX_PATH=C:/Miniconda/envs/test/Library -DvMMVII_BUILD=ON -DMMVII_KEEP_LIBRARY_MMV1=ON -DMMV1_PATH=libelise-win-dev

    - name: Build MMVII
      run: cmake --build build --config Release -j 4 --target full

    - name: Run MMVII Tests
      working-directory: ./bin
      run: ./MMVII Bench 1

    - name: Package
      shell: bash
      run: |
        rm -fr bin/Makefile* bin/*.makefile bin/MMVII-* bin/*.lib  MMVII-TestDir/Tmp/
        mkdir -p MMVII
        cp -a MMVII-LocalParameters/ MMVII-RessourceDir/ MMVII-TestDir/ bash-completion/ bin/ share/ MMVII/
        MMVII_BINDIR=$(pwd)/MMVII/bin
        
        # dll for PROJ, GDAL
        cd /C/Miniconda/envs/test/Library/bin/
        cp -a archive.dll blosc.dll charset.dll deflate.dll freexl.dll gdal.dll geos.dll geos_c.dll iconv.dll icu*.dll jpeg8.dll ${MMVII_BINDIR}/
        cp -a brotlicommon.dll brotlidec.dll brotlienc.dll hwy.dll jxl.dll jxl_cms.dll jxl_threads.dll muparser.dll ${MMVII_BINDIR}/
        cp -a Lerc.dll libbz2.dll libcrypto-3-x64.dll libcurl.dll libexpat.dll liblzma.dll libminizip.dll libpng16.dll libsharpyuv.dll ${MMVII_BINDIR}/
        cp -a libssh2.dll libssl-3-x64.dll libwebp.dll libxml2.dll lz4.dll pcre2-8.dll proj_9.dll psl-*.dll snappy.dll spatialite.dll ${MMVII_BINDIR}/
        cp -a sqlite3.dll tiff.dll xerces-c*.dll zlib.dll zstd.dll ${MMVII_BINDIR}/
        cd $GITHUB_WORKSPACE

        # Qt5 for vMMMVII
        mkdir -p MMVII/bin/platforms
        cd $QT_ROOT_DIR/bin
        cp Qt5Core.dll Qt5Gui.dll Qt5Xml.dll Qt5OpenGL.dll Qt5Widgets.dll ${MMVII_BINDIR}/
        cd $QT_ROOT_DIR/plugins
        cp platforms/qwindows.dll ${MMVII_BINDIR}/platforms/
        cd $GITHUB_WORKSPACE

    - name: Create Zip
      run: 7z a mmvii_windows.zip MMVII
    
    - name: Remove previous Windows MMVII build release
      env:
         GH_TOKEN: ${{ github.token }}
      continue-on-error: true
      run: gh release delete Windows_MMVII_build -y --cleanup-tag

    - name: Upload binaries to release
      uses: softprops/action-gh-release@v2
      with:
        name: 'Windows MMVII build - Latest'
        tag_name: Windows_MMVII_build
        make_latest: false
        token: ${{ secrets.GITHUB_TOKEN }}
        files: mmvii_windows.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows-build-artifacts
        path: |
          MMVII/bin/libP2007.lib
          MMVII/bin/MMVII.exe

  build_apipy:
    needs: [build_linux] #[build_linux, build_win]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest] # [windows-latest, ubuntu-latest]
        python-version: ["3.12"] # ["3.10", "3.12"]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install deps
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install clang-18 libomp-18-dev libproj-dev proj-data libgdal-dev python3-pip pybind11-dev doxygen clang-tools llvm-dev

    - name: Install Miniconda 
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@v3
      with:
         auto-update-conda: true

    - name: Install Doxygen
      if: runner.os == 'Windows'
      uses: ssciwr/doxygen-install@v1

          
    - name: Install GDAL,PROJ with miniconda
      if: runner.os == 'Windows' #&& steps.cache-conda-gdal.outputs.cache-hit != 'true'
      run: conda install -c conda-forge -q -y proj gdal pybind11 wheel setuptools pkg-config

    - name: Download linux build artifacts
      if: runner.os == 'Linux'
      uses: actions/download-artifact@v8
      with:
        name: linux-build-artifacts
        path: bin/

    - name: Download win build artifacts
      if: runner.os == 'Windows'
      uses: actions/download-artifact@v8
      with:
        name: windows-build-artifacts
        path: bin/

    - name: Display structure of downloaded files
      run: ls -R bin/

    - name: Check PKG_CONFIG_PATH and proj.pc
      if: runner.os == 'Windows'
      run: |
        echo $PKG_CONFIG_PATH
        dir "C:/Miniconda/envs/test/Library/lib/pkgconfig"
        pkg-config --list-all
        conda list proj

    - name: Add requirements
      if: runner.os == 'Linux'
      run: python -m pip install --upgrade wheel setuptools

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==3.1.3

    - name: Compile E57Format for Linux
      if: runner.os == 'Linux'
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4 --target E57Format -- -k
      env:
        CXX: clang++-18
        CC: clang-18

    - name: Compile E57Format for Windows
      if: runner.os == 'Windows'
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH=C:/Miniconda/envs/test/Library
        cmake --build build --config Release -j 4 --target E57Format

    - name: Build and install for Linux
      if: runner.os == 'Linux'
      working-directory: ./apib11/
      run: |
        # cibuildwheel --output-dir dist --platform linux # TODO: make it work
        pip wheel . --no-deps -w dist/
        pip install dist/mmvii*.whl
      env:
        CXX: clang++-18
        CC: clang-18
    - name: Build for Windows
      if: runner.os == 'Windows'
      working-directory: ./apib11/
      run: |
        pip wheel . --no-deps -w dist/
      env:
        CMAKE_PREFIX_PATH: "C:/Miniconda/envs/test/Library"
        PKG_CONFIG_PATH: "C:/Miniconda/envs/test/Library/lib/pkgconfig"

    - name: Install for Windows
      if: runner.os == 'Windows'
      working-directory: ./apib11/
      run: |
        pip install dist/mmvii*.whl
      env:
        CMAKE_PREFIX_PATH: "C:/Miniconda/envs/test/Library"
        PKG_CONFIG_PATH: "C:/Miniconda/envs/test/Library/lib/pkgconfig"

    - name: Test
      continue-on-error: true
      working-directory: ./apib11/examples
      run: python ex_test.py

    - name: Upload MMVII apipy
      uses: softprops/action-gh-release@v2
      with:
          name: 'MMVII Python API - Latest'
          tag_name: MMVII_APIPY
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: apib11/dist/*.whl

